<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login – AI-Solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>
<div class="admin-login-wrap">
  <div class="admin-login-box">
    <div class="admin-logo" style="text-align:center;margin-bottom:2rem">
      <div class="logo-icon" style="font-size:2.5rem;margin-bottom:.5rem"><i class="fas fa-microchip"></i></div>
      <h1 style="font-family:'Outfit',sans-serif;font-size:1.8rem;font-weight:800;color:#000">AI<span class="accent">-Solutions</span></h1>
      <p style="color:var(--text-light);font-size:.9rem;margin-top:.5rem">Admin Portal — Authorised Access Only</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="flash flash-{{ cat }}" style="margin-bottom:1rem">
            <span>{{ msg }}</span>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/admin/login">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="admin" required autofocus/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••••" required/>
      </div>
      <button type="submit" class="btn-primary" style="width:100%;justify-content:center;margin-top:.5rem">
        <i class="fas fa-lock"></i> Sign In
      </button>
    </form>

    <p style="text-align:center;margin-top:1.5rem;font-size:.85rem;color:var(--text-light)">
      <a href="/" style="color:var(--primary);text-decoration:none;font-weight:600">← Back to website</a>
    </p>
  </div>
</div>
</body>
</html>
